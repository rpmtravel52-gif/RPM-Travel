name: Kirim e-tiket otomatis

# Memanggil endpoint cron tiap ±10 menit (Vercel Hobby hanya mengizinkan cron harian).
# Butuh secret repo: CRON_SECRET (nilainya sama dengan CRON_SECRET di Vercel).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  send-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Panggil /api/cron/send-tickets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then echo "Secret CRON_SECRET belum diisi di repo"; exit 1; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://rpmtravel.co.id/api/cron/send-tickets"
